<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{{ url_for('static', filename='upload/log.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* Fond assombri pour lisibilité */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: 0;
        }

        .calendar-container {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.95);
            padding: 25px 15px;
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            animation: fadeIn 0.8s ease;
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.8rem;
        }

        table.calendar {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: center;
        }

        table.calendar th, table.calendar td {
            border: 1px solid #dee2e6;
            width: 14.28%;
            height: 100px;
            vertical-align: top;
            font-size: 1rem;
            position: relative;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
        }

        table.calendar th {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }

        table.calendar td:hover:not(.today) {
            background-color: #e9f3ff;
            transform: scale(1.03);
        }

        .today {
            background-color: #198754 !important;
            color: white;
            font-weight: bold;
        }

        .tooltip {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #ffc107;
            color: #000;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.75rem;
            display: none;
        }

        table.calendar td:hover .tooltip {
            display: block;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 📱 Adaptation tablette */
        @media (max-width: 768px) {
            h2 { font-size: 1.5rem; }
            table.calendar th, table.calendar td {
                height: 70px;
                font-size: 0.9rem;
            }
        }

        /* 📱 Adaptation téléphone */
        @media (max-width: 480px) {
            h2 { font-size: 1.3rem; }
            table.calendar th, table.calendar td {
                height: 60px;
                font-size: 0.8rem;
                padding: 2px;
            }
        }

        /* 🌙 Mode sombre automatique */
        @media (prefers-color-scheme: dark) {
            .calendar-container {
                background: rgba(20,20,20,0.95);
                color: #f8f9fa;
            }
            table.calendar th {
                background-color: #375a7f;
            }
            table.calendar td {
                border-color: #444;
                color: #e9ecef;
            }
            table.calendar td:hover:not(.today) {
                background-color: #2d2d2d;
            }
            .today {
                background-color: #20c997 !important;
                color: #fff;
            }
            .tooltip {
                background: #ffc107;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <!-- Fond assombri -->
    <div class="overlay"></div>

    <div class="calendar-container">
        <h2>📅 Calendrier du mois</h2>
        <table class="table calendar">
            <thead class="text-center">
                <tr>
                    <th>Lun</th>
                    <th>Mar</th>
                    <th>Mer</th>
                    <th>Jeu</th>
                    <th>Ven</th>
                    <th>Sam</th>
                    <th>Dim</th>
                </tr>
            </thead>
            <tbody>
                {% for week in weeks %}
                    <tr>
                        {% for day in week %}
                            {% if day == 0 %}
                                <td></td>
                            {% else %}
                                <td class="{% if year == today.year and month == today.month and day == today.day %}today{% endif %}">
                                    {{ day }}
                                    <span class="tooltip">Événement !</span>
                                </td>
                            {% endif %}
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
