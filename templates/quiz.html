<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Quiz Informatique - Ir Joel Piako</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #007bff, #6610f2);
            color: #fff;
            transition: background 0.3s ease, color 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        body.dark-mode {
            background: #1e1e2f;
            color: #f0f8ff;
        }

        .btn-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
        }

        .quiz-container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            color: #222;
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
            padding: 30px;
            animation: fadeIn 0.8s ease;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode .quiz-container {
            background: #2c2c3c;
            color: #f0f8ff;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
            color: #007bff;
        }

        body.dark-mode h2 {
            color: #00bfff;
        }

        .question-box {
            background: #f8f9fa;
            border: 1px solid #e3e3e3;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode .question-box {
            background: #3a3a4a;
            border-color: #555;
            color: #f0f8ff;
        }

        .btn-success {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 576px) {
            .quiz-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="btn-toggle">
    <button id="modeBtn" class="btn btn-outline-dark btn-sm">🌙 Mode sombre</button>
</div>

<div class="quiz-container">
    <h2>📝 Quiz Informatique<br><small>Préparé par Ir Joel Piako</small></h2>
    <form method="POST">
        {% for q in questions %}
            <div class="question-box">
                <p><b>{{ q.id }}. {{ q.question }}</b></p>
                {% for choice in q.choices %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="{{ q.id }}" value="{{ choice }}" required>
                        <label class="form-check-label">{{ choice }}</label>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">✅ Soumettre mes réponses</button>
    </form>
</div>

<script>
    const modeBtn = document.getElementById('modeBtn');
    modeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        if(document.body.classList.contains('dark-mode')){
            modeBtn.textContent = '☀ Mode clair';
            modeBtn.classList.replace('btn-outline-dark', 'btn-outline-light');
        } else {
            modeBtn.textContent = '🌙 Mode sombre';
            modeBtn.classList.replace('btn-outline-light', 'btn-outline-dark');
        }
    });
</script>

</body>
</html>
