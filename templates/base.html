<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            font-size: 18px;
            padding: 0;
            margin: 0;
        }
        h1, h2, h3 {
            font-size: 2rem;
        }
        p {
            font-size: 1.2rem;
        }
        a {
            font-size: 1.1rem;
        }
        .btn, a.btn, a[role="button"] {
            padding: 18px 28px;
            font-size: 1.2rem;
            border-radius: 10px;
        }
        .container {
            max-width: 100%;
            padding: 15px;
        }
        @media (max-width: 768px) {
            h1, h2, h3 {
                font-size: 1.7rem;
            }
            p, a {
                font-size: 1.1rem;
            }
            .btn, a.btn {
                font-size: 1.1rem;
                padding: 16px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
