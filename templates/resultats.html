<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats des apprentissages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{{ url_for('static', filename='upload/lpt.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: 0;
        }

        .results-container {
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            max-width: 900px;
            width: 100%;
            margin: 40px auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            animation: fadeIn 0.8s ease;
        }

        h2 {
            text-align: center;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 20px;
        }

        /* Table */
        table {
            font-size: 1rem;
        }

        .btn-custom {
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px;
        }

        /* Mode sombre */
        body.dark .results-container {
            background: rgba(20,20,20,0.95);
            color: #f8f9fa;
        }
        body.dark h2 {
            color: #20c997;
        }
        body.dark table {
            color: #f8f9fa;
        }
        body.dark .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(255,255,255,0.05);
        }
        body.dark .btn-primary {
            background-color: #20c997;
            border: none;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 📱 Adaptation mobile */
        @media (max-width: 768px) {
            .results-container {
                margin: 20px;
                padding: 20px 15px;
            }
            table {
                font-size: 0.9rem;
            }
        }

        /* Bouton switch */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="results-container">
        <!-- Switch sombre/clair -->
        <button id="theme-toggle" class="theme-toggle">🌙</button>

        <h2>📊 Résultats via l'équipe du dev Joel Piako</h2>
        <div class="table-responsive">
            <table class="table table-striped text-center align-middle">
                <thead>
                    <tr>
                        <th>Étudiant</th>
                        <th>Matière</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Glody Limando</td>
                        <td>Création web et app mobile</td>
                        <td>18/20</td>
                    </tr>
                    <tr>
                        <td>Charlie Piako</td>
                        <td>Excel</td>
                        <td>19/20</td>
                    </tr>
                    <tr>
                        <td>Dédié Ezabu</td>
                        <td>Access</td>
                        <td>19/20</td>
                    </tr>
                    <tr>
                        <td>Chris Ndonga</td>
                        <td>Base Python</td>
                        <td>17/20</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-custom">⬅ Retour au Dashboard</a>
    </div>

    <script>
        const toggleBtn = document.getElementById("theme-toggle");
        const body = document.body;

        // Charger préférence
        if (localStorage.getItem("theme") === "dark") {
            body.classList.add("dark");
            toggleBtn.textContent = "☀️";
        }

        toggleBtn.addEventListener("click", () => {
            body.classList.toggle("dark");
            if (body.classList.contains("dark")) {
                toggleBtn.textContent = "☀️";
                localStorage.setItem("theme", "dark");
            } else {
                toggleBtn.textContent = "🌙";
                localStorage.setItem("theme", "light");
            }
        });
    </script>
</body>
</html>
