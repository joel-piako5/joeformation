<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des matières</title>
    <!-- Lien Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{{ url_for('static', filename='upload/acc.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Effet assombrissant derrière la carte */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
        }

        .card {
            border-radius: 15px;
            overflow: hidden;
            animation: fadeIn 0.8s ease;
            background: rgba(255,255,255,0.95); /* par défaut clair */
        }

        .card-header {
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .list-group-item {
            font-size: 1rem;
            padding: 14px 18px;
            transition: all 0.3s ease;
        }

        .list-group-item:hover {
            background-color: #f0f8ff;
            transform: translateX(5px);
        }

        .btn-custom {
            display: block;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            border-radius: 8px;
            padding: 14px;
            transition: transform 0.2s ease, background 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            background: #0d6efd;
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 📱 Adaptation mobile */
        @media (max-width: 600px) {
            .card-header {
                font-size: 1.4rem;
            }
            .list-group-item {
                font-size: 0.95rem;
            }
            .btn-custom {
                font-size: 1rem;
                padding: 12px;
            }
        }

        /* 🌙 Mode sombre automatique */
        @media (prefers-color-scheme: dark) {
            body {
                background-image: url("{{ url_for('static', filename='upload/acc.jpg') }}");
            }
            .overlay {
                background: rgba(0,0,0,0.6); /* plus sombre */
            }
            .card {
                background: rgba(30,30,30,0.9);
                color: #f1f1f1;
            }
            .card-header {
                background: #0d6efd !important;
                color: #fff !important;
            }
            .list-group-item {
                background: rgba(40,40,40,0.9);
                color: #f1f1f1;
            }
            .list-group-item:hover {
                background: rgba(60,60,60,1);
            }
            .btn-custom {
                border: 1px solid #0d6efd;
                color: #0d6efd;
            }
            .btn-custom:hover {
                background: #0d6efd;
                color: #fff;
            }
        }
    </style>
</head>
<body>
    <!-- Fond assombri -->
    <div class="overlay"></div>

    <div class="container p-3">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                📚 Liste des matières
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    {% for m in matieres %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ m }}
                            <span class="badge bg-success rounded-pill">Disponible</span>
                        </li>
                    {% endfor %}
                </ul>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-lg btn-custom">⬅ Retour au Dashboard</a>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
