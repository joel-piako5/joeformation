<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des Utilisateurs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f8ff; /* mode clair par défaut */
            color: #1e1e2f;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background-color: #1e1e2f;
            color: #f0f8ff;
        }

        .btn-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999;
        }

        .user-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .user-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        body.dark-mode .user-card {
            background-color: #2c2c3c;
            color: #f0f8ff;
        }

        .user-card h5 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        .user-card p {
            margin: 2px 0;
        }

        .btn-return {
            margin-top: 20px;
        }

        @media (max-width: 576px) {
            .user-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="btn-toggle">
    <button id="modeBtn" class="btn btn-outline-dark btn-sm">🌙 Mode sombre</button>
</div>

<div class="container">
    <h2 class="mb-4 text-center">📋 Liste des utilisateurs inscrits</h2>

    {% for etudiant in etudiants %}
    <div class="user-card">
        <h5>{{ etudiant.nom }} (ID: {{ etudiant.id }})</h5>
        <p><strong>Email :</strong> {{ etudiant.email }}</p>
        <p><strong>Rôle :</strong> {{ etudiant.role }}</p>
    </div>
    {% endfor %}

    <a href="{{ url_for('menu') }}" class="btn btn-primary w-100 btn-return">⬅ Retour</a>
</div>

<script>
    const modeBtn = document.getElementById('modeBtn');
    modeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        if(document.body.classList.contains('dark-mode')){
            modeBtn.textContent = '☀ Mode clair';
            modeBtn.classList.replace('btn-outline-dark', 'btn-outline-light');
        } else {
            modeBtn.textContent = '🌙 Mode sombre';
            modeBtn.classList.replace('btn-outline-light', 'btn-outline-dark');
        }
    });
</script>

</body>
</html>
